# docker-compose para deploy do DisparaZap na Coolify.
#
# As URLs publicas estao fixadas aqui. Na Coolify e preciso definir:
#   - POSTGRES_PASSWORD  (APENAS letras e numeros, sem # @ : / ?)
#   - JWT_SECRET         (string longa e aleatoria) -- ja configurada
#   - ADMIN_EMAIL        (opcional; e-mail que vira admin)
#
# Se um dia mudar de dominio, ajuste FRONTEND_URL, BACKEND_URL e
# NEXT_PUBLIC_API_URL abaixo e faca redeploy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: disparazap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: disparazap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disparazap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://disparazap:${POSTGRES_PASSWORD}@db:5432/disparazap?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_URL: https://disparazap.online
      BACKEND_URL: https://api.disparazap.online
      # Chromium do sistema (ja instalado na imagem)
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      # --- Pagamentos (opcionais) ---
      MISTIC_PAY_CLIENT_ID: ${MISTIC_PAY_CLIENT_ID:-}
      MISTIC_PAY_CLIENT_SECRET: ${MISTIC_PAY_CLIENT_SECRET:-}
      MISTIC_PAY_WEBHOOK_URL: ${MISTIC_PAY_WEBHOOK_URL:-}
      PIX_KEY: ${PIX_KEY:-}
      PIX_NAME: ${PIX_NAME:-}
      PIX_CITY: ${PIX_CITY:-}
    volumes:
      - wa_tokens:/app/tokens
      - wa_uploads:/app/uploads
      - wa_cache:/app/.wwebjs_cache
    expose:
      - "3001"
    # SHM maior evita crashes do Chromium sob carga.
    shm_size: "1gb"

  frontend:
    build:
      context: ./frontend
      args:
        # URL PUBLICA do backend, embutida no build do Next.js.
        NEXT_PUBLIC_API_URL: https://api.disparazap.online
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  pgdata:
  wa_tokens:
  wa_uploads:
  wa_cache:
